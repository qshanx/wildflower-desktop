<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>野花原 · 池塘花园</title>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{width:100%;height:100%;margin:0;overflow:hidden}
  body{color:#fff8db;font:14px/1.5 system-ui,sans-serif;background:#4a6f42 url('pond-botanical.webp') center / 100% 100% no-repeat}
  #field{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  button,select{font:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,select:focus-visible{outline:2px solid #fff0aa;outline-offset:3px}
  #vase{position:absolute;left:calc(7% + 37px);bottom:calc(7% + 20px);width:58px;height:74px;border:0;background:transparent;padding:0;text-align:center;touch-action:none;cursor:grab}
  #vase[data-moving]{cursor:grabbing}
  #vase svg{display:block;width:100%;height:100%;overflow:visible}
  #vase[aria-pressed=true] svg{filter:drop-shadow(0 0 6px #ffe7a4)}
  #vase span{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max-content;pointer-events:none;color:#fff8d7;text-shadow:0 2px 6px #162819}
  .wallpaper #shed{bottom:max(68px,8%)}
  .wallpaper #vase{bottom:calc(max(64px,8%) + 20px)}
  #shed{position:absolute;right:clamp(12px,4%,65px);bottom:clamp(20px,5%,54px);width:clamp(140px,12vw,176px);pointer-events:none}
  #shed button{pointer-events:auto}
  #stump{display:block;width:100%;height:auto;filter:brightness(var(--tool-light,1))}
  #stump-top{position:absolute;top:4%;left:8%;width:84%;height:49%;border:0;padding:0;background:none;clip-path:ellipse(49% 49%)}
  #stump-top:focus-visible{background:#f8d69038}
  #basket{background:none;border:0;padding:0;display:grid;place-items:center;width:53px;height:42px}
  #basket svg{width:53px;height:41px;filter:drop-shadow(0 2px 2px #1c2a1b99)}
  #basket[aria-expanded=true] svg{filter:drop-shadow(0 1px 5px #ffdd8d99)}
  #seeds-panel{position:absolute;right:11%;bottom:calc(100% + 3px);width:162px;height:152px;z-index:1}
  .rack-frame{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(1px 2px 2px #14271cbd)}
  #rack{position:absolute;inset:15px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,61px);align-items:start;justify-items:center}
  .seed{position:relative;grid-column:span 2;width:52px;height:57px;padding:3px 2px 1px;border:1px solid #9f784a;border-radius:4px 3px 5px 4px;background:linear-gradient(147deg,#f3dfb2,#d2ac78);color:#473923;transform:rotate(-3deg);box-shadow:1px 3px 5px #16281962,inset 0 0 0 2px #ffedd378;font-size:10px;line-height:1.2;white-space:nowrap}
  .seed::before{content:"";position:absolute;width:6px;height:12px;background:linear-gradient(90deg,#935c36,#e0b27a 45%,#b57b4d 60%,#77492f);left:calc(50% - 3px);top:-8px;border-radius:2px;box-shadow:1px 1px 1px #4a352068}
  .seed:nth-child(2){transform:rotate(3deg)}
  .seed:nth-child(3){grid-column:2 / span 2;transform:rotate(-1deg)}
  .seed:is(:hover,[aria-pressed=true]){box-shadow:0 0 6px #ffde85,inset 0 0 0 2px #ffefd1;background:#f5ddb4}
  .seed-art{display:block;width:39px;height:39px;margin:0 auto 1px;background-image:url('pond-botanical-atlas.webp');background-size:400% 300%;background-repeat:no-repeat}
  #controls{position:absolute;left:50%;top:13%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;filter:brightness(var(--tool-light,1))}
  #planting-done,#settings,#options{border:1px solid #eadb9e55;border-radius:9px;background:#243d2aeb;color:#fff7d8;padding:5px 9px}
  #planting-done{white-space:nowrap}
  #settings{position:absolute;right:calc(100% + 8px);bottom:12px;white-space:nowrap}
  #shears{display:grid;place-items:center;width:53px;height:42px;padding:0;border:0;background:none}
  #shears svg{width:52px;height:39px;filter:drop-shadow(1px 2px 2px #1b291bdc)}
  #shears:is(:hover,[aria-pressed=true]) svg{filter:drop-shadow(0 0 5px #f9d68b) drop-shadow(1px 2px 2px #263719)}
  #snip{position:absolute;width:64px;height:44px;pointer-events:none;z-index:2;filter:drop-shadow(1px 3px 2px #172419);transform:translate(-8%,-52%) rotate(-9deg)}
  .upper-blade{transform-origin:34px 24px;transform:rotate(var(--upper,0deg));transition:transform 80ms ease-out}
  .lower-blade{transform-origin:34px 24px;transform:rotate(var(--lower,0deg));transition:transform 80ms ease-out}
  #snip.closed{--upper:-14deg;--lower:14deg}
  @media(prefers-reduced-motion:reduce){.upper-blade,.lower-blade{transition:none}}
  #options{position:absolute;bottom:100%;right:0;margin-bottom:14px;min-width:190px;padding:10px 12px;pointer-events:auto}
  #options label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
  #options button{width:100%;background:#35543c;border:1px solid #e6d5a477;border-radius:5px;padding:3px 7px}
  #options button:disabled{opacity:.55;cursor:default}
  #options select{background:#314a30;border:1px solid #e6d5a477;border-radius:5px;padding:2px}
  #status{position:absolute;pointer-events:none;bottom:3%;left:50%;transform:translateX(-50%);width:max-content;max-width:80vw;text-align:center;padding:4px 11px;background:#1d3525db;border-radius:12px}
  .wallpaper #status{bottom:max(90px,11%)}
  #garden-actions{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;display:flex;align-items:center;justify-content:center;gap:6px;width:max-content;max-width:90vw;pointer-events:none}
  .wallpaper #garden-actions{bottom:max(70px,8%)}
  .wallpaper #status{bottom:max(112px,13%)}
  #garden-actions button,#tool-tip{background:#263e2beb;border:1px solid #eadb9e88;color:#fff7d8;border-radius:9px;padding:5px 9px}
  #garden-actions button{pointer-events:auto}
  #tool-tip{position:absolute;z-index:3;pointer-events:none;white-space:nowrap;font-size:12px}
  #stump-top[data-hover]{background:#f8d69038}
  #basket[data-hover] svg,#shears[data-hover] svg{filter:drop-shadow(0 0 5px #ffe7a0)}
  #carried-shears{position:absolute;width:42px;height:30px;z-index:2;pointer-events:none;transform:translate(9px,7px);filter:drop-shadow(1px 2px 2px #172419)}
  #status:empty{display:none}
  @media(max-width:550px){#vase{left:1%;bottom:8%;transform:scale(.78);transform-origin:bottom left}#shed{right:10px}#status{bottom:1%}}
</style>
</head>
<body>
<canvas id="field" aria-label="池塘和可播种的岸边草地"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="blade-steel" x2="20%" y2="100%"><stop stop-color="#e7efe2"/><stop offset=".48" stop-color="#abbcb6"/><stop offset="1" stop-color="#586b6c"/></linearGradient>
  <symbol id="shear-art" viewBox="0 0 70 48">
    <g class="upper-blade"><path d="M3 11Q16 10 40 22L43 27L34 27Q14 22 3 11Z" fill="url(#blade-steel)" stroke="#405452" stroke-width="1.1"/>
    <path d="M37 24L48 31" stroke="#876039" stroke-width="5"/><ellipse cx="56" cy="33" rx="9" ry="6.5" transform="rotate(15 56 33)" fill="none" stroke="#754c30" stroke-width="5.5"/><ellipse cx="56" cy="32" rx="9" ry="6.5" transform="rotate(15 56 32)" fill="none" stroke="#c69a58" stroke-width="2.3"/></g>
    <g class="lower-blade"><path d="M4 35Q19 35 41 24L42 19L33 21Q14 25 4 35Z" fill="url(#blade-steel)" stroke="#405452" stroke-width="1.1"/>
    <path d="M37 22L48 15" stroke="#876039" stroke-width="5"/><ellipse cx="55" cy="13" rx="9" ry="6.5" transform="rotate(-16 55 13)" fill="none" stroke="#754c30" stroke-width="5.5"/><ellipse cx="55" cy="12" rx="9" ry="6.5" transform="rotate(-16 55 12)" fill="none" stroke="#deb576" stroke-width="2.3"/></g>
    <circle cx="34" cy="24" r="2.7" fill="#654928" stroke="#dfbb76" stroke-width="1.3"/>
  </symbol>
</defs></svg>
<svg id="snip" hidden aria-hidden="true"><use href="#shear-art"/></svg>
<button id="vase" aria-label="花瓶" aria-pressed="false">
  <svg viewBox="0 0 58 74" aria-hidden="true">
    <ellipse cx="29" cy="68" rx="26" ry="6" fill="#2d422a" opacity=".58"/>
    <defs><linearGradient id="glass" x2="100%" y2="20%"><stop stop-color="#a9dbbc" stop-opacity=".58"/><stop offset=".5" stop-color="#c3e6c9" stop-opacity=".27"/><stop offset="1" stop-color="#5c9479" stop-opacity=".68"/></linearGradient></defs>
    <path d="M18 12h22l-3 17c1 11 13 13 12 26-1 12-11 14-20 14S10 67 9 55c-1-13 11-15 12-26Z" fill="url(#glass)" stroke="#c7e6b4" stroke-width="1.2"/>
    <path d="M18 12c0-5 22-5 22 0s-22 5-22 0Z" fill="#74957b" fill-opacity=".31" stroke="#d7ebbb"/>
    <path d="M12 53q17 8 34 0" fill="none" stroke="#dfefcd" opacity=".6"/>
  </svg>
  <span>花瓶 · 0 枝</span>
</button>
<section id="shed" aria-label="园艺工具">
  <img id="stump" src="pond-workbench.webp" width="400" height="236" alt="">
  <button id="stump-top" type="button" aria-label="木墩：打开种子挂架" aria-controls="seeds-panel" aria-expanded="false" title="打开种子挂架"></button>
  <div id="seeds-panel" hidden>
    <svg class="rack-frame" viewBox="0 0 162 152" aria-hidden="true">
      <path d="M9 10V139M153 10V139" stroke="#755237" stroke-width="8" stroke-linecap="round"/>
      <path d="M8 10V137M152 10V137" stroke="#c69a61" stroke-width="4" stroke-linecap="round"/>
      <path d="M8 15Q81 23 153 15M8 76Q81 85 153 76" stroke="#503c27" stroke-width="3" fill="none"/>
      <path d="M8 14Q81 22 153 14M8 75Q81 84 153 75" stroke="#d3b983" stroke-width="1.3" fill="none"/>
    </svg>
    <div id="rack" aria-label="挂绳上的种子袋"></div>
  </div>
  <div id="controls">
    <button id="shears" type="button" aria-label="剪刀" title="剪刀" aria-pressed="false"><svg aria-hidden="true"><use href="#shear-art"/></svg></button>
    <button id="basket" type="button" aria-label="种子篮" aria-controls="seeds-panel" aria-expanded="false" title="打开种子篮">
      <svg viewBox="0 0 68 53" aria-hidden="true">
        <path d="M17 27C17 4 49 4 51 27" fill="none" stroke="#6c452f" stroke-width="6"/>
        <path d="M17 26C17 4 49 4 51 26" fill="none" stroke="#d9ad67" stroke-width="3"/>
        <path d="M8 25Q34 30 60 25L55 44Q52 48 34 49Q15 48 13 44Z" fill="#ac7544" stroke="#e9bb77" stroke-width="2"/>
        <path d="M12 32Q34 39 57 32M13 38Q34 44 55 38M15 44Q34 49 53 44" fill="none" stroke="#e1b77a" stroke-width="1.7"/>
        <path d="M19 30L22 46M27 32L28 48M35 32V48M42 31L41 48M50 30L47 46" stroke="#795133" stroke-width="1.4"/>
        <path d="M10 25Q34 19 59 25Q59 30 34 32Q10 31 10 25Z" fill="#c99a62" stroke="#efc68c" stroke-width="1.8"/>
        <path d="M28 24Q24 17 33 15Q38 19 32 24M35 24Q36 16 44 18Q44 24 35 24" fill="#829849"/>
      </svg>
    </button>
  </div>
  <button id="settings" aria-expanded="false">设置</button>
  <div id="options" hidden>
    <label>画面特效 <select id="effects"><option value="still">静态</option><option value="soft">柔和</option><option value="rich">丰富</option></select></label>
    <button id="tour" aria-pressed="false">预览一天 · 45 秒</button>
    <label>加速试玩 <input id="fast" type="checkbox"></label>
    <button id="remove-stem" disabled>取出花瓶里最早的一枝</button>
  </div>
</section>
<div id="garden-actions">
  <button id="planting-done" type="button" hidden>完成</button>
  <button id="tool-state" hidden></button>
  <span id="vase-actions" hidden>
    <button id="vase-smaller" aria-label="缩小花瓶">−</button>
    <button id="vase-larger" aria-label="放大花瓶">＋</button>
    <button id="vase-center">居中</button>
    <button id="vase-reset">归位</button>
    <button id="vase-done">完成摆放</button>
  </span>
  <button id="undo" hidden>撤销</button>
</div>
<div id="tool-tip" hidden></div>
<svg id="carried-shears" aria-hidden="true" hidden><use href="#shear-art"/></svg>
<div id="status" role="status"></div>
<script>
'use strict';
const field=document.querySelector('#field'), c=field.getContext('2d'), $=id=>document.getElementById(id);
const rack=$('rack'), seedsPanel=$('seeds-panel'), basket=$('basket'), stump=$('stump'), stumpTop=$('stump-top'), shed=$('shed'), vase=$('vase'), shears=$('shears'), effects=$('effects'), fast=$('fast');
stump.addEventListener('load',requestDraw);
const species=[
  {name:'波斯菊',petals:8,color:'#ef9bb7',shade:'#a83967',center:'#f2b747'},
  {name:'雏菊',petals:12,color:'#fff2cc',shade:'#bbad93',center:'#e7a637'},
  {name:'蓝矢车菊',petals:7,color:'#aaa5ee',shade:'#4f549c',center:'#743f84'}
];
const palette=[...species,
  {name:'红罂粟',petals:5,color:'#ef5852',shade:'#8c292e',center:'#533f2c',cup:true},
  {name:'金盏菊',petals:12,color:'#ffcb49',shade:'#ce8527',center:'#75461c'},
  {name:'浅杏野花',petals:7,color:'#f1be8e',shade:'#bd7057',center:'#804b36'},
  {name:'粉色野花',petals:9,color:'#f294b4',shade:'#90456e',center:'#73314e'},
  {name:'紫色花穗',petals:6,color:'#ac96d4',shade:'#594881',center:'#e4c380',spike:true},
  {name:'奶白野花',petals:9,color:'#f5efca',shade:'#b9b57a',center:'#c5a342',spike:true},
  {name:'橙色野花',petals:6,color:'#ef901e',shade:'#aa5f2a',center:'#49381e',cup:true}];
const STORE='pond-garden-v2', HOURS=5*60*60*1000, DEMO=6000, CAP=360, VASE_CAP=8, LANTERN_CAP=4;
const PIXELS=1920*1080, TOUR_MS=45000, TWO_PI=Math.PI*2, reduced=matchMedia('(prefers-reduced-motion:reduce)');
const validFlower=f=>f&&Number.isInteger(f.kind)&&f.kind>=0&&f.kind<palette.length&&typeof f.id==='string';
let data={flowers:[],vase:[],held:null,cutWild:[],lanterns:[],settings:{effects:'soft',fast:false}};
let storageReadable=true;
try{
  const raw=localStorage.getItem(STORE),saved=JSON.parse(raw);
  if(raw!==null){
    if(!saved||typeof saved!=='object'||Array.isArray(saved)||!Array.isArray(saved.flowers)||!Array.isArray(saved.vase))throw new Error('Invalid garden save');
    data.flowers=Array.isArray(saved.flowers)?saved.flowers.filter(f=>validFlower(f)&&f.kind<species.length&&[f.x,f.y,f.at].every(Number.isFinite)&&f.x>=0&&f.x<=1&&f.y>=0&&f.y<=1&&[HOURS,DEMO].includes(f.duration)).slice(0,CAP):[];
    data.vase=Array.isArray(saved.vase)?saved.vase.filter(validFlower).slice(0,VASE_CAP):[];
    if(Array.isArray(saved.cutWild))data.cutWild=saved.cutWild.filter(id=>Number.isInteger(id)&&id>=0&&id<2000);
    data.held=validFlower(saved.held)?saved.held:null;
    if(Array.isArray(saved.lanterns))data.lanterns=saved.lanterns.filter(p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>.018&&p.x<.982&&p.y>.052&&p.y<.963).slice(0,LANTERN_CAP);
    if(data.flowers.length!==saved.flowers.length||data.vase.length!==saved.vase.length||(saved.held!=null&&!data.held)||(saved.lanterns!=null&&(!Array.isArray(saved.lanterns)||data.lanterns.length!==saved.lanterns.length)))storageReadable=false;
    data.settings.effects=['still','soft','rich'].includes(saved.settings?.effects)?saved.settings.effects:'soft';
    data.settings.fast=saved.settings?.fast===true;
    const placement=saved.settings?.vasePlacement;
    if(placement&&[placement.x,placement.y,placement.zoom].every(Number.isFinite))
      data.settings.vasePlacement=placement;
  }
}catch{storageReadable=false;}
let renderedFrames=0;
const diagnosticsEnabled=new URLSearchParams(location.search).get("diagnostics")==="1";
let W,H,tool=0,plantingMode=false,drawing=null,previous=null,dragGap=0,frame=0,ambient=0,stageTimer=0,statusTimer=0,particles=[],visible=true,tourStart=null,carriedFly=null;
const visibleFlies=[], capturedFlies=new Set();
let wasNight=false;
const wild=[];
const wildBlooms=[];
const background=new Image();
background.onload=()=>requestDraw();
background.src='pond-botanical.webp';
const botanical=new Image();
botanical.src='pond-botanical-atlas.webp';
botanical.onload=()=>requestDraw();
const botanicalKinds=[[0,1],[2,3],[8,9],[6,7],[4],[5],[0,1],[10],[5],[4]];
// Normalized shoreline traced from pond-botanical.webp; shared by planting and water lighting.
const bank=[[.253,.402],[.254,.372],[.262,.340],[.273,.308],[.291,.280],[.315,.242],
  [.346,.216],[.378,.199],[.414,.173],[.441,.151],[.479,.154],[.515,.150],
  [.540,.140],[.586,.135],[.634,.133],[.680,.144],[.726,.167],[.773,.184],
  [.822,.209],[.868,.250],[.910,.279],[.929,.314],[.938,.357],[.952,.399],
  [.960,.424],[.965,.467],[.964,.516],[.956,.559],[.939,.590],[.922,.625],
  [.907,.649],[.873,.660],[.835,.675],[.792,.685],[.753,.692],[.713,.705],
  [.673,.716],[.635,.714],[.588,.697],[.542,.684],[.504,.667],[.464,.646],
  [.432,.628],[.397,.607],[.363,.583],[.335,.556],[.314,.529],[.291,.497],
  [.277,.477],[.264,.451],[.257,.424]];
function inWater(u,v){
  let inside=false;
  for(let i=0,j=bank.length-1;i<bank.length;j=i++){
    const [x,y]=bank[i],[a,b]=bank[j];
    if((y>v)!==(b>v)&&u<(a-x)*(v-y)/(b-y)+x)inside=!inside;
  }
  return inside;
}
let sceneSeed=44981;
function sceneRandom(){sceneSeed=(Math.imul(1664525,sceneSeed)+1013904223)>>>0;return sceneSeed/4294967296;}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{ x=clamp(x);return x*x*(3-2*x); };
// Local wall time is read each frame; this also follows OS time zone changes.
function sceneHour(now){
  if(tourStart!==null)return 5.5+19*clamp((now-tourStart)/TOUR_MS);
  const d=new Date(now);
  return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
}
function gatherWildflowers(){
  const clumps=Array.from({length:164},(_,i)=>{
    const j=Math.floor(sceneRandom()*bank.length),a=bank[j],b=bank[(j+1)%bank.length],v=sceneRandom();
    const x=a[0]*(1-v)+b[0]*v,y=a[1]*(1-v)+b[1]*v;
    const r=1.05+sceneRandom()*.38;
    const u=i<104?.58+(x-.58)*r:sceneRandom();
    const w=i<104?.46+(y-.46)*r:sceneRandom();
    return {x:u,y:w,kind:Math.floor(sceneRandom()*palette.length),early:sceneRandom(),radius:.018+sceneRandom()*.041};
  });
  for(const patch of clumps){
    const n=5+Math.floor(sceneRandom()*7);
    for(let i=0;i<n;i++){
      const a=sceneRandom()*TWO_PI,r=Math.sqrt(sceneRandom())*patch.radius;
      const x=patch.x+Math.cos(a)*r,y=patch.y+Math.sin(a)*r*1.32;
      if(!(x>.012&&x<.997&&y>.025&&y<.98)||inWater(x,y))continue;
      const kind=sceneRandom()<.55?patch.kind:Math.floor(sceneRandom()*palette.length);
      const tiles=botanicalKinds[kind], tile=tiles[Math.floor(sceneRandom()*tiles.length)];
      wild.push({id:wild.length,x,y,kind,tile,size:(.19+Math.pow(sceneRandom(),1.4)*.52)*(.82+y*.36),
        opens:6.5+patch.early*4.1+sceneRandom()*1.3,wave:sceneRandom()*TWO_PI,
        lean:(sceneRandom()-.5)*.89,flip:sceneRandom()<.5?-1:1,motion:sceneRandom()<.22});
    }
  }
  wild.sort((a,b)=>a.y-b.y);
}
function glow(x,y,sx,sy,rgb,opacity){
  if(opacity<.005)return;
  c.save();c.translate(x,y);c.scale(sx,sy);
  const g=c.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,'rgba('+rgb+','+opacity+')');
  g.addColorStop(.46,'rgba('+rgb+','+(opacity*.63)+')');g.addColorStop(1,'rgba('+rgb+',0)');
  c.fillStyle=g;c.fillRect(-1,-1,2,2);c.restore();
}
const fireflies=Array.from({length:21},(_,i)=>{
  const [x,y]=bank[(i*11+3)%bank.length],f=1.17+(i%4)*.045;
  return {x:.58+(x-.58)*f,y:.46+(y-.46)*f,phase:i*2.39996,speed:.48+(i%5)*.12};
});
function fireflyState(f,t){
  const a=f.phase+t*f.speed,b=f.phase*1.9+t*.61;
  return {
    x:clamp(f.x+.041*Math.sin(a)+.017*Math.cos(b),.022,.978),
    y:clamp(f.y+.047*Math.cos(a*.92)+.017*Math.sin(b),.047,.94),
    blink:.12+.88*Math.pow(.5+.5*Math.sin(t*2.4+f.phase),2.4)
  };
}
const reflectedStars=Array.from({length:35},(_,i)=>({
  x:.23+((i*113+17)%347)/490, y:.19+((i*71+32)%317)/560, phase:i*2.39996
})).filter(p=>inWater(p.x,p.y));
function waterStars(t,night){
  if(night<.12)return;
  c.lineCap='round';

  }
  renderedFrames++;
  if(diagnosticsEnabled)window.chrome?.webview?.postMessage({type:"frame",frameCount:renderedFrames});
  nextAmbient(animated||particles.length>0,now);
}
function burst(x,y,kind){
  if(data.settings.effects==='still'||reduced.matches)return;
  const count=data.settings.effects==='rich'?8:3,t=performance.now();
  for(let i=0;i<count;i++){
    const a=Math.random()*TWO_PI,r=9+Math.random()*26;
    particles.push({x,y,t,dx:Math.cos(a)*r,dy:Math.sin(a)*r-9,color:species[kind].color});
  }
  if(particles.length>64)particles=particles.slice(-64);
}
function shore(u,v){
  return u>.018&&u<.982&&v>.052&&v<.963&&!inWater(u,v);
}
function sow(x,y,feedback){
  const u=x/W,v=y/H;
  if(!shore(u,v)){if(feedback)info('把种子撒在池塘岸边的草地上。');return;}
  if(data.flowers.length>=CAP){if(feedback)info('草地种满了。剪下一些花再播种。');return;}
  if(data.flowers.some(f=>Math.hypot((f.x-u)*W,(f.y-v)*H)<9*scale())){
    if(feedback&&plantingMode)info('这里已经播种，试试旁边的草地。');
    return;
  }
  data.flowers.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,9),kind:tool,x:u,y:v,at:Date.now(),duration:data.settings.fast?DEMO:HOURS});
  burst(x,y,tool);requestDraw();
  if(feedback&&plantingMode)info('已种下'+species[tool].name+'。');
}
function plantStatus(x,y){
  let best=null,dist=26*scale();
  const now=Date.now(),z=scale();
  for(const p of gardenLayout()){
    const f=p.f,phase=stage(f,now),height=(phase===3?72:[4,25,48][phase])*p.size*z;
    const dx=p.x*W-x,dy=p.y*H-y;
    const hitDistance=Math.hypot(dx,dy-Math.max(0,Math.min(height,dy)));
    if(hitDistance<dist){dist=hitDistance;best=p;}
  }
  let wildHit=null;
  if(!best){
    let nearest=Infinity;
    for(const p of wildBlooms){
      if(data.cutWild.includes(p.f.id))continue;
      const d=Math.hypot(p.x-x,p.y-y);
      if(d<=p.r&&d<=nearest){wildHit=p.f;nearest=d;}
    }
  }
  if(!best&&!wildHit){info('把剪刀对准一朵盛开的花。');return;}
  if(best&&stage(best.f,now)<3){info('这株还没开花。');return;}
  if(data.held){info('手里有一枝花，先点花瓶插好。');return;}
  if(data.vase.length>=VASE_CAP){info('花瓶已插满。');return;}
  const {id,kind}=wildHit||best.f;
  remember('剪花');
  if(wildHit)data.cutWild.push(id);else data.flowers=data.flowers.filter(f=>f.id!==id);
  const {tile,flip}=wildHit||best;
  data.held={id:wildHit?'wild-'+id:id,kind,tile,flip};
  playSnip((wildHit||best).x*W,(wildHit||best).y*H);
  persist();sync();requestDraw();scheduleGrowth();
  info('剪下'+palette[kind].name+'。点花瓶插好。');
}
function showSeeds(open){
  seedsPanel.hidden=!open;
  basket.setAttribute('aria-expanded',String(open));
  stumpTop.setAttribute('aria-expanded',String(open));
  if(open){$('options').hidden=true;$('settings').setAttribute('aria-expanded','false');}
  refreshPointer();
}
function select(next){
  const wasOpen=!seedsPanel.hidden;
  if(carriedFly!==null){capturedFlies.delete(carriedFly);carriedFly=null;requestDraw();}
  showSeeds(false);tool=next;
  plantingMode=typeof next==='number'&&document.body.classList.contains('wallpaper');sync();
  if(wasOpen&&!document.body.classList.contains('wallpaper'))basket.focus({preventScroll:true});
  info(next==='cut'?'剪刀已选。点一株开花的花。':species[next].name+'已选。点按或拖动撒种。');
}
function refreshPointer(){if(pointer)hover(pointer.x,pointer.y);}
function stopTool(){
  finish();
  if(!seedsPanel.hidden){showSeeds(false);refreshPointer();return;}
  tool=0;plantingMode=false;sync();
}
function sync(){
  [...rack.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===tool)));
  shears.setAttribute('aria-pressed',String(tool==='cut'));
  $('planting-done').hidden=!plantingMode;
  $('planting-done').textContent=plantingMode?species[tool].name+' · 点草地播种 / 完成':'完成';
  vase.setAttribute('aria-pressed',String(Boolean(data.held)));
  vase.querySelector('span').textContent=data.held?'插入手里的花':'花瓶 · '+data.vase.length+' 枝';
  vase.querySelector('span').hidden=document.body.classList.contains('wallpaper')&&!data.held;
  const state=$('tool-state');
  state.hidden=!data.held&&tool!=='cut';
  state.disabled=Boolean(data.held)&&tool!=='cut'&&!plantingMode;
  state.textContent=data.held?(state.disabled?'手持花枝 · 点花瓶':'手持花枝 · 点花瓶 / 放下剪刀'):
    tool==='cut'?'剪刀 · 点盛开的花 / 放下':'';
  $('undo').hidden=!lastUndo;
  $('undo').textContent=lastUndo?'撤销'+lastUndo.label:'撤销';
  refreshPointer();
  $('remove-stem').disabled=data.vase.length===0;
  field.style.cursor=tool==='cut'?'pointer':'crosshair';
}
function lanternClick(x,y){
  const atNight=nightLevel(sceneHour(Date.now()))>.08;
  if(carriedFly!==null){
    if(!atNight){carriedFly=null;return false;}
    if(!shore(x/W,y/H)){info('把萤火虫瓶放在草地上。');return true;}
    const position={x:x/W,y:y/H};
    if(data.lanterns.some(p=>Math.hypot((p.x-position.x)*W,(p.y-position.y)*H)<25)){
      info('这里已经有一只瓶子。换一块草地吧。');return true;
    }
    data.lanterns.push(position);carriedFly=null;persist();requestDraw();
    info('萤火虫瓶已放好。');return true;
  }
  const jar=data.lanterns.findIndex(p=>Math.hypot(p.x*W-x,p.y*H-y-13*scale())<22);
  if(jar>=0){
    data.lanterns.splice(jar,1);persist();requestDraw();info('收起了萤火虫瓶。');return true;
  }
  if(!atNight)return false;
  let hit=null,d=19;
  for(const p of visibleFlies){
    if(capturedFlies.has(p.i))continue;
    const dist=Math.hypot(p.x-x,p.y-y);
    if(dist<d){hit=p;d=dist;}
  }
  if(!hit)return false;
  if(data.lanterns.length>=LANTERN_CAP){info('最多放四只萤火虫瓶。点旧瓶就能收起。');return true;}
  carriedFly=hit.i;capturedFlies.add(hit.i);requestDraw();
  info('捉到了。再点一块草地放瓶。');return true;
}
function begin(id,x,y){
  if(drawing!==null)return;
  if(!seedsPanel.hidden){showSeeds(false);return;}
  if(tool==='cut'){plantStatus(x,y);return;}
  if(lanternClick(x,y))return;
  startStroke(id,x,y);
}
function startStroke(id,x,y){
  if(drawing!==null)return;
  beforeStroke=snapshot();drawing=id;previous=[x,y];sow(x,y,true);
}
function move(id,x,y){
  if(drawing!==id)return;
  const [a,b]=previous,dist=Math.hypot(x-a,y-b),z=scale();
  if(!dragGap)dragGap=(19+Math.random()*27)*z;
  for(let d=dragGap;d<=dist;d+=dragGap){
    const u=a+(x-a)*d/dist,v=b+(y-b)*d/dist;
    const spread=(Math.random()-.5)*38*z,jx=u-(y-b)*spread/dist,jy=v+(x-a)*spread/dist;
    if(shore(u/W,v/H)){
      if(shore(jx/W,jy/H))sow(jx,jy,false);else sow(u,v,false);
    }
    previous=[u,v];dragGap=(19+Math.random()*27)*z;
  }
}
function finish(id){
  if(drawing===null || (id!==undefined && drawing!==id))return;
  drawing=null;previous=null;dragGap=0;
  if(beforeStroke&&data.flowers.length>beforeStroke.flowers.length){remember('播种',beforeStroke);persist();scheduleGrowth();}
  beforeStroke=null;
}
makeAtlas();gatherWildflowers();sync();
if(!storageReadable)info('旧存档无法读取，已保留原文件。当前种植暂不保存。');
field.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  begin(e.pointerId,e.clientX,e.clientY);
  if(drawing===e.pointerId)try{field.setPointerCapture(e.pointerId);}catch{}
});
window.addEventListener('pointermove',e=>hover(e.clientX,e.clientY));
document.documentElement.addEventListener('pointerleave',()=>hover(-1,-1));
field.addEventListener('pointermove',e=>move(e.pointerId,e.clientX,e.clientY));
for(const name of ['pointerup','pointercancel','lostpointercapture'])window.addEventListener(name,e=>finish(e.pointerId));
addEventListener('blur',()=>finish());
addEventListener('pagehide',()=>finish());
addEventListener('resize',layout);
function onVisibility(on){
  visible=Boolean(on);
  if(!visible || document.hidden){hover(-1,-1);finish();clearTimeout(ambient);if(frame)cancelAnimationFrame(frame);frame=0;particles=[];}
  else requestDraw();
  scheduleGrowth();
}
document.addEventListener('visibilitychange',()=>onVisibility(visible));
let vaseDrag=null;
function placeVase(){
  const position=data.settings.vasePlacement;
  if(position){
    const z=Math.max(.65,Math.min(1.8,position.zoom,H/255));
    const half=29*z, height=74*z;
    const x=Math.max(half+8,Math.min(W-half-8,position.x*W));
    const y=Math.max((data.vase.length?174:37)*z+8,Math.min(H-height/2-(document.body.classList.contains('wallpaper')?68:8),position.y*H));
    Object.assign(vase.style,{left:(x-half)+'px',top:(y-height/2)+'px',bottom:'auto',width:58*z+'px',height:height+'px',transform:'none'});
  }else for(const key of ['left','top','bottom','width','height','transform'])vase.style[key]='';
  requestDraw();
}
function vasePosition(){
  const b=vase.getBoundingClientRect();
  return {x:(b.left+b.width/2)/W,y:(b.top+b.height/2)/H,zoom:b.width/58};
}
function changeVase(position){
  data.settings.vasePlacement=position;
  placeVase();persist();
}
function startVase(id,x,y){
  finish();
  vaseDrag={id,x,y,from:vasePosition(),moved:false};
}
function moveVase(id,x,y){
  if(vaseDrag?.id!==id)return false;
  const d=vaseDrag, dx=x-d.x, dy=y-d.y;
  if(!d.moved&&Math.hypot(dx,dy)<5)return true;
  d.moved=true;vase.setAttribute('data-moving','');
  data.settings.vasePlacement={x:Math.max(0,Math.min(1,d.from.x+dx/W)),y:Math.max(0,Math.min(1,d.from.y+dy/H)),zoom:d.from.zoom};
  placeVase();return true;
}
function endVase(id,click){
  if(!vaseDrag||(id!==undefined&&vaseDrag.id!==id))return false;
  const moved=vaseDrag.moved;
  vaseDrag=null;vase.removeAttribute('data-moving');
  if(moved)persist();else if(click)useVase();
  return true;
}
vase.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  startVase(e.pointerId,e.clientX,e.clientY);
  vase.setPointerCapture(e.pointerId);
});
vase.addEventListener('pointermove',e=>moveVase(e.pointerId,e.clientX,e.clientY));
vase.addEventListener('pointerup',e=>endVase(e.pointerId,true));
for(const event of ['pointercancel','lostpointercapture'])vase.addEventListener(event,e=>endVase(e.pointerId,false));
vase.onclick=e=>{if(e.detail===0)useVase();};
for(const [id,delta] of [['vase-smaller',-.2],['vase-larger',.2]])
  $(id).onclick=()=>{const p=vasePosition();changeVase({...p,zoom:Math.max(.65,Math.min(1.8,p.zoom+delta))});};
$('vase-center').onclick=()=>{
  const p=vasePosition();
  changeVase({...p,x:.5,y:.5+(data.vase.length?55*p.zoom/H:0)});
};
$('vase-reset').onclick=()=>changeVase(undefined);
$('vase-done').onclick=()=>$('vase-actions').hidden=true;
function useVase(){
  if(!data.held){$('vase-actions').hidden=!$('vase-actions').hidden;return;}
  if(data.vase.length>=VASE_CAP){info('花瓶已插满。');return;}
  remember('插瓶');
  if(!reduced.matches&&data.settings.effects!=='still'){
    const b=vase.getBoundingClientRect();
    inserting={id:data.held.id,start:performance.now(),x:pointer?Math.max(48,Math.min(W-48,pointer.x+18)):b.left+b.width+28,
      y:pointer?Math.max(102,pointer.y+47):b.bottom-12};
  }
  data.vase.push(data.held);data.held=null;lifted=null;persist();sync();requestDraw();info('已插入'+palette[data.vase.at(-1).kind].name+' · 瓶中 '+data.vase.length+' 枝');
}
$('remove-stem').onclick=()=>{
  if(!data.vase.length)return;
  remember('取花');data.vase.shift();persist();sync();requestDraw();info('已取出最早的一枝。');
};
basket.onclick=()=>{const open=seedsPanel.hidden;finish();tool=0;plantingMode=false;sync();showSeeds(open);};
stumpTop.onclick=()=>basket.click();
$('planting-done').onclick=()=>{finish();plantingMode=false;sync();info('已退出种植。');};
$('tool-state').onclick=stopTool;
$('undo').onclick=()=>{
  finish();
  if(!lastUndo)return;
  const {label,before}=lastUndo;lastUndo=null;
  Object.assign(data,before);lifted=inserting=null;particles=[];
  clearTimeout(snipTimer);$('snip').setAttribute('hidden','');
  if(persist())info('已撤销'+label+'。');
  sync();requestDraw();scheduleGrowth();
};
addEventListener('keydown',e=>{if(e.key==='Escape')stopTool();});
shears.onclick=()=>{
  if(tool!=='cut'){select('cut');return;}
  tool=0;plantingMode=false;sync();info('剪刀已放下。');
};
$('settings').onclick=()=>{
  showSeeds(false);
  const panel=$('options');panel.hidden=!panel.hidden;$('settings').setAttribute('aria-expanded',String(!panel.hidden));
};
$('tour').onclick=toggleTour;
effects.value=data.settings.effects;fast.checked=data.settings.fast;
effects.onchange=()=>{data.settings.effects=effects.value;particles=[];persist();requestDraw();};
fast.onchange=()=>{data.settings.fast=fast.checked;persist();info(fast.checked?'之后播的种子约 6 秒开花。':'之后播的种子约 5 小时开花。');};
window.meadowDesktop=(action,x,y)=>{
  if(action==='hover'){hover(x,y);return;}
  if(action==='escape'){stopTool();return;}
  if(action==='flush'){endVase(undefined,false);finish();return persist();}
  if(action==='tour'){toggleTour();return;}
  if(action==='visible'){onVisibility(x);return;}
  if(action==='wallpaper'){finish();plantingMode=false;showSeeds(false);document.body.classList.toggle('wallpaper',Boolean(x));placeVase();sync();$('options').hidden=true;$('settings').setAttribute('aria-expanded','false');$('settings').hidden=Boolean(x);return;}
  if(action==='down'||action==='plainDown'||action==='windowsDown'){
    if(pointer)hover(x,y);
    const hit=document.elementFromPoint(x,y);
    if(hit?.closest('#vase')){startVase('desktop',x,y);return;}
    if(action==='plainDown'||action==='windowsDown'){
      const button=hit?.closest('#basket,#stump-top,#rack button,#planting-done,#shears,#undo,#tool-state,#vase-actions button');
      if(button){button.click();return;}
      if(hit===field){
        if(!seedsPanel.hidden){showSeeds(false);return;}
        if(tool==='cut'){plantStatus(x,y);return;}
        if(action==='windowsDown'&&lanternClick(x,y))return;
        if(plantingMode&&shore(x/W,y/H))startStroke('desktop',x,y);
        else if(plantingMode)info('把种子撒在池塘岸边的草地上。');
      }
    }else if(hit===field)begin('desktop',x,y);
    else if(hit?.closest('#shed,#vase,#garden-actions'))hit.closest('button')?.click();
  }else if(action==='drag'){if(!moveVase('desktop',x,y))move('desktop',x,y);}
  else if(action==='up'){if(!endVase('desktop',true))finish('desktop');}
};
window.meadowDiagnostics=()=>({ready:renderedFrames>0&&background.naturalWidth>0&&botanical.naturalWidth>0&&stump.naturalWidth>0,frameCount:renderedFrames,flowerCount:data.flowers.length,width:W,height:H,visible,plantingMode,selected:tool,message:$('status').textContent});
window.livelyWallpaperPlaybackChanged=payload=>{
  try {
    const status=typeof payload==='string'?JSON.parse(payload):payload;
    if(typeof status?.IsPaused==='boolean')onVisibility(!status.IsPaused);
  } catch {}
};
layout();scheduleGrowth();
</script>
